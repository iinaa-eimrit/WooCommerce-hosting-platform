apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-only-backend }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway-backend } } }]
      ports: [{ protocol: TCP, port: 5432 }]
