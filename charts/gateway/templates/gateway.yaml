apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: gateway }
            - { name: POSTGRES_DB, value: gateway }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: postgres-password } } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, gateway, -d, gateway] }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, gateway, -d, gateway] }, initialDelaySeconds: 30, periodSeconds: 15, failureThreshold: 6 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates: [{ metadata: { name: data }, spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgres.storage }} } } } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-backend }
spec:
  selector: { matchLabels: { app: gateway-backend } }
  template:
    metadata: { labels: { app: gateway-backend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: postgres-password } } }
            - { name: DATABASE_URL, value: "postgres://gateway:$(POSTGRES_PASSWORD)@postgres:5432/gateway" }
            - { name: SESSION_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: session-secret } } }
            - { name: CREDENTIALS_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: credentials-key } } }
            - { name: ADMIN_EMAIL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: admin-email } } }
            - { name: ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: admin-password } } }
            - { name: LLM_API_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: llm-api-key } } }
            - { name: LLM_MODEL, value: {{ .Values.llm.model | quote }} }
            {{- if .Values.llm.baseURL }}
            - { name: LLM_BASE_URL, value: {{ .Values.llm.baseURL | quote }} }
            {{- end }}
            {{- if .Values.llm.reasoningEffort }}
            - { name: LLM_REASONING_EFFORT, value: {{ .Values.llm.reasoningEffort | quote }} }
            {{- end }}
            - { name: COOKIE_SECURE, value: {{ .Values.cookieSecure | quote }} }
            - { name: SEED_CRED_WOO, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: woo-mcp-token } } }
            - { name: SEED_CRED_UTILS, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: utils-token } } }
            - { name: SEED_SERVERS, value: {{ .Values.seedServers | quote }} }
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway-backend }
spec: { selector: { app: gateway-backend }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dashboard }
spec:
  selector: { matchLabels: { app: dashboard } }
  template:
    metadata: { labels: { app: dashboard } }
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http } }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: dashboard }
spec: { selector: { app: dashboard }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: gateway }
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - { path: /mcp, pathType: Prefix, backend: { service: { name: gateway-backend, port: { number: 8080 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: gateway-backend, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: dashboard, port: { number: 8080 } } } }
