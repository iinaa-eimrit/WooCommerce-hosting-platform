apiVersion: v1
kind: ConfigMap
metadata: { name: store-files }
data:
  setup.sh: |
{{ .Files.Get "files/setup.sh" | indent 4 }}
  urumi-mcp-auth.php: |
{{ .Files.Get "files/urumi-mcp-auth.php" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: store-setup-{{ .Release.Revision }}
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: {{ .Values.setup.image }}
          command: [/bin/sh, /scripts/setup.sh]
          securityContext: { runAsUser: 33, runAsGroup: 33 }
          env:
            - { name: SITE_URL, value: {{ .Values.siteUrl | quote }} }
            - { name: SITE_TITLE, value: {{ .Values.siteTitle | quote }} }
            - { name: WP_ADMIN_USER, value: admin }
            - { name: WP_ADMIN_EMAIL, value: admin@urumi.local }
            - { name: WP_CORE_VERSION, value: {{ .Values.wordpress.version | quote }} }
            - { name: HOME, value: /tmp }
            - { name: WP_CLI_CACHE_DIR, value: /tmp/.wp-cli/cache }
            - { name: WP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: wp-admin-password } } }
            - { name: WORDPRESS_DB_HOST, value: mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - { name: WORDPRESS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: mariadb-password } } }
          volumeMounts:
            - { name: wordpress, mountPath: /var/www/html }
            - { name: scripts, mountPath: /scripts }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      volumes:
        - { name: wordpress, persistentVolumeClaim: { claimName: wordpress-data } }
        - { name: scripts, configMap: { name: store-files, defaultMode: 493 } }
