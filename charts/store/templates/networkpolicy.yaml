apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: woo-mcp-allow-gateway }
spec:
  podSelector: { matchLabels: { app: woo-mcp } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: gateway } }
          podSelector: { matchLabels: { app: gateway-backend } }
      ports: [{ protocol: TCP, port: 3000 }]
