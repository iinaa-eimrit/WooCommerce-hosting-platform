apiVersion: v1
kind: Service
metadata: { name: mariadb }
spec: { clusterIP: None, selector: { app: mariadb }, ports: [{ port: 3306 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mariadb }
spec:
  serviceName: mariadb
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          env:
            - { name: MARIADB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: mariadb-root-password } } }
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            - { name: MARIADB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: mariadb-password } } }
          ports: [{ containerPort: 3306 }]
          readinessProbe: { exec: { command: [healthcheck.sh, --connect] }, initialDelaySeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates: [{ metadata: { name: data }, spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.storage.mariadbSize }} } } } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: wordpress-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.storage.wordpressSize }} } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: wordpress }
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: wordpress } }
  template:
    metadata: { labels: { app: wordpress } }
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          env:
            - { name: WORDPRESS_DB_HOST, value: mariadb }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - { name: WORDPRESS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: mariadb-password } } }
            - { name: MCP_STORE_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: store-token } } }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /wp-json/, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /wp-login.php, port: http }, initialDelaySeconds: 45, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
            - { name: mcp-plugin, mountPath: /var/www/html/wp-content/mu-plugins, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: wordpress-data } }
        - { name: mcp-plugin, configMap: { name: store-files, items: [{ key: urumi-mcp-auth.php, path: urumi-mcp-auth.php }] } }
---
apiVersion: v1
kind: Service
metadata: { name: wordpress }
spec: { selector: { app: wordpress }, ports: [{ name: http, port: 80, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: woo-mcp }
spec:
  selector: { matchLabels: { app: woo-mcp } }
  template:
    metadata: { labels: { app: woo-mcp } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.image.repository }}:{{ .Values.wooMcp.image.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          env:
            - { name: WOO_BASE_URL, value: "http://wordpress.{{ .Release.Namespace }}.svc.cluster.local" }
            - { name: STORE_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: store-token } } }
            - { name: MCP_INBOUND_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: mcp-inbound-token } } }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: woo-mcp }
spec: { selector: { app: woo-mcp }, ports: [{ name: http, port: 3000, targetPort: http }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: store }
spec: { ingressClassName: {{ .Values.ingress.className }}, rules: [{ host: {{ .Values.ingress.host }}, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: wordpress, port: { number: 80 } } } }] } }] }
